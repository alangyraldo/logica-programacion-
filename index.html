<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordenar números</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Ordenar tres números</h1>
    <p id="entrada">Esperando los números...</p>

    <div class="bloque">
      <h2>De mayor a menor</h2>
      <p id="mayor-a-menor">-</p>
    </div>

    <div class="bloque">
      <h2>De menor a mayor</h2>
      <p id="menor-a-mayor">-</p>
    </div>

    <p id="iguales" hidden>Los tres números son iguales.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
